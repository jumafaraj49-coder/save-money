<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Pesa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #222;
        }

        header {
            background: #0b6b3a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            color: #0b6b3a;
        }

        .actions {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        button {
            background: #0b6b3a;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            margin: 10px 10px 0 0;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 40px
